<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="100%" height="100%">
  <!-- EKKAYI Secondary Mark - Forest Green on Transparent with Gold Dot -->
  <g transform="translate(100, 85)" fill="none" stroke="#2D4C3A" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Horizontal inner bar -->
    <path d="M -58 0 L -14 0" />
    
    <!-- Top outer loop curving up and around -->
    <path d="M -58 0 A 58 58 0 0 1 42 -40" />
    
    <!-- Bottom outer arc -->
    <path d="M -58 16 A 58 58 0 0 0 42 42" />
    
    <!-- Right intersecting organic petal / crescent curve -->
    <path d="M 48 -54 C 14 -22, 14 22, 48 54" />
    
    <!-- Bottom-right angled accent stroke -->
    <path d="M 40 44 L 60 56" />
    
    <!-- Center Gold Accent Dot -->
    <circle cx="-2" cy="0" r="7.5" fill="#C5A75C" stroke="none" />
  </g>
  
  <!-- Brand Wordmark -->
  <text x="100" y="195" text-anchor="middle" font-family="'Outfit', 'Avenir Next', -apple-system, sans-serif" font-size="22" font-weight="600" letter-spacing="0.22em" fill="#2D4C3A">EKKAYI</text>
</svg>
